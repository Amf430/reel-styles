<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/r/engine/web/base.css">
<style>
  .piece { position: absolute; transform-origin: 50% 50%; }
  .sheet { position: relative; }
  .sheet > .core, .sheet > .face { position: absolute; inset: 0; }
  .sheet > .face { background-blend-mode: multiply; }
  .sheet > .content { position: relative; }
  .tape { position: absolute; width: 4.2em; height: 1.25em; z-index: 3; }
  .chips { display: flex; flex-wrap: wrap; gap: .18em .22em; justify-content: center; }
  .chip { position: relative; display: inline-block; line-height: 1.1; padding: .1em .32em .18em; }
  .chip > .bg { position: absolute; inset: 0; z-index: -1; }
  .clip-lines i { display: block; height: .38em; margin: .32em 0; border-radius: .1em; }
  .photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
import { Reel, tw, ease, clamp, rand } from "/r/engine/web/base.js";

const R = await Reel.init();
let pieces = [];

// Torn edge: a jagged polygon just inside the box (px). `bite` = how deep the tears go.
function torn(w, h, seed, bite, step) {
  const pts = [], n = (len) => Math.max(4, Math.round(len / step));
  const edge = (x0, y0, x1, y1, nx, ny, s) => {
    const N = n(Math.hypot(x1 - x0, y1 - y0));
    for (let i = 0; i < N; i++) {
      const k = i / N, d = bite * (0.25 + 0.75 * rand(i, s, seed)) * (rand(i * 7, s, seed) < 0.15 ? 2.2 : 1);
      pts.push(`${(x0 + (x1 - x0) * k + nx * d).toFixed(1)}px ${(y0 + (y1 - y0) * k + ny * d).toFixed(1)}px`);
    }
  };
  edge(0, 0, w, 0, 0, 1, 1); edge(w, 0, w, h, -1, 0, 2); edge(w, h, 0, h, 0, -1, 3); edge(0, h, 0, 0, 1, 0, 4);
  return `polygon(${pts.join(",")})`;
}

// Paper grain, once per seed: speckle + faint fibres, multiplied over the paper colour.
const grainCache = {};
function grain(seed) {
  if (grainCache[seed]) return grainCache[seed];
  const c = document.createElement("canvas"); c.width = c.height = 160;
  const x = c.getContext("2d"), img = x.createImageData(160, 160);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 225 + rand(i, seed) * 30;
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 255;
  }
  x.putImageData(img, 0, 0);
  x.strokeStyle = "rgba(120,100,70,.10)"; x.lineWidth = 0.6;
  for (let f = 0; f < 40; f++) {
    x.beginPath(); const sx = rand(f, seed, 1) * 160, sy = rand(f, seed, 2) * 160;
    x.moveTo(sx, sy); x.quadraticCurveTo(sx + rand(f, 3) * 20 - 10, sy + rand(f, 4) * 20 - 10, sx + rand(f, 5) * 30 - 15, sy + rand(f, 6) * 30 - 15); x.stroke();
  }
  return (grainCache[seed] = c.toDataURL());
}

function sheetHTML(inner) {
  return `<div class="sheet"><div class="core"></div><div class="face"></div><div class="content">${inner}</div></div>`;
}
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const FONTS = ['"Lalezar"', '"Amiri"', '"Reem Kufi"', "Tajawal"];

const TYPES = {
  paper: (c) => sheetHTML(`${c.kicker ? `<div class="kicker">${esc(c.kicker)}</div>` : ""}<div class="head">${esc(c.text)}</div>${c.sub ? `<div class="sub">${esc(c.sub)}</div>` : ""}`),
  clipping: (c) => sheetHTML(`<div class="head">${esc(c.text)}</div><div class="clip-lines">${Array.from({ length: c.lines ?? 5 }, () => "<i></i>").join("")}</div>`),
  photo: (c) => sheetHTML(`<div class="photo"><img src="${R.asset(c.src)}"></div>${c.caption ? `<div class="sub">${esc(c.caption)}</div>` : ""}`),
  ransom: (c) => `<div class="chips">${String(c.text ?? "").split(/\s+/).filter(Boolean).map((w) => `<span class="chip"><span class="bg"></span>${esc(w)}</span>`).join("")}</div>`,
  tape: () => `<div class="tape" style="position:relative"></div>`,
};

function build() {
  document.body.dir = R.P.dir || "rtl";
  R.stage.innerHTML = "";
  R.clearItems();
  pieces = (R.P.pieces || []).map((c, i) => {
    if (!TYPES[c.type]) { console.error("unknown piece", c.type); return null; }
    const el = document.createElement("div");
    el.className = "piece";
    el.innerHTML = TYPES[c.type](c);
    // Tape strips on chosen corners (default: two for paper/photo).
    const tapes = c.tape ?? (c.type === "paper" || c.type === "photo" || c.type === "clipping" ? ["tl", "br"] : []);
    for (const corner of tapes) { const t = document.createElement("div"); t.className = "tape"; t.dataset.c = corner; el.appendChild(t); }
    R.stage.appendChild(el);
    R.item({ id: "piece" + i, label: `${c.type}${c.text ? " · " + c.text : ""}`, els: [el], in: `pieces.${i}.in`, out: `pieces.${i}.out`, xf: `pieces.${i}.xf` });
    return { c, el, i, seed: (c.seed ?? i) + 3 };
  }).filter(Boolean);
  layout();
}

function layout() {
  const T = R.T, u = R.u;
  for (const k of pieces) {
    const c = k.c, el = k.el, s = k.seed;
    el.style.fontSize = (c.size ?? 60) * u + "px";
    el.style.width = c.w ? c.w * R.W + "px" : "auto";
    const sheet = el.querySelector(".sheet");
    if (sheet) {
      const content = sheet.querySelector(".content");
      content.style.padding = c.type === "photo" ? ".35em .35em 1.1em" : ".55em .8em .65em";
      content.style.color = c.ink || T.ink;
      content.style.textAlign = "center";
      const head = content.querySelector(".head"), sub = content.querySelector(".sub"), kick = content.querySelector(".kicker");
      if (head) Object.assign(head.style, { fontFamily: c.font ? `"${c.font}"` : c.type === "clipping" ? '"Amiri"' : '"Lalezar"', fontWeight: 700, lineHeight: 1.15, color: c.head_color || "" });
      if (sub) Object.assign(sub.style, { fontFamily: '"Amiri"', fontSize: ".45em", marginTop: ".35em", opacity: .85 });
      if (kick) Object.assign(kick.style, { fontFamily: '"Reem Kufi"', fontSize: ".38em", color: T.accent, letterSpacing: ".02em", marginBottom: ".2em" });
      content.querySelectorAll(".clip-lines i").forEach((ln, j) => Object.assign(ln.style, { background: c.ink || T.ink, opacity: 0.22, width: (60 + rand(j, s) * 40) + "%", marginInline: "auto" }));
      const ph = content.querySelector(".photo");
      if (ph) Object.assign(ph.style, { width: "100%", aspectRatio: c.aspect ?? "4/3" });
      const sub2 = content.querySelector(".photo + .sub"); if (sub2) sub2.style.fontFamily = '"Reem Kufi"';
      // Torn face with a slightly bigger white core peeking out = the torn-paper fibre edge.
      const w = sheet.offsetWidth, h = sheet.offsetHeight, bite = (c.tear ?? 1) * 7 * u, step = 9 * u;
      const face = sheet.querySelector(".face"), core = sheet.querySelector(".core");
      Object.assign(face.style, { background: `url(${grain(s)}) 0 0 / ${160 * u}px, ${c.paper || T.paper}`, clipPath: torn(w, h, s, bite, step) });
      Object.assign(core.style, { background: "#fbf9f3", clipPath: torn(w, h, s + 50, bite * 0.45, step * 0.8) });
      sheet.style.filter = `drop-shadow(0 ${6 * u}px ${10 * u}px rgba(0,0,0,.35))`;
    }
    el.querySelectorAll(".chip").forEach((ch, j) => {
      const ci = Math.floor(rand(j, s) * T.chips.length);
      Object.assign(ch.style, { fontFamily: FONTS[Math.floor(rand(j, s, 2) * FONTS.length)], fontWeight: 700, color: T.chip_ink[ci],
        fontSize: (0.85 + rand(j, s, 3) * 0.4) + "em", rotate: (rand(j, s, 4) * 10 - 5) + "deg", translate: `0 ${(rand(j, s, 5) - 0.5) * 0.15}em` });
      const bg = ch.querySelector(".bg"), bw = ch.offsetWidth, bh = ch.offsetHeight;
      Object.assign(bg.style, { background: `url(${grain(s + j)}) 0 0 / ${160 * u}px, ${T.chips[ci]}`, backgroundBlendMode: "multiply", clipPath: torn(bw, bh, s + j, 3 * u, 6 * u),
        filter: `drop-shadow(0 ${3 * u}px ${4 * u}px rgba(0,0,0,.35))` });
    });
    el.querySelectorAll(".tape").forEach((tp, j) => {
      const cr = tp.dataset.c || "tl", top = cr[0] === "t", left = cr[1] === "l";
      Object.assign(tp.style, { background: T.tape, top: top ? "-.45em" : "auto", bottom: top ? "auto" : "-.45em", left: left ? "-1.2em" : "auto", right: left ? "auto" : "-1.2em",
        rotate: `${(left === top ? -1 : 1) * (32 + rand(j, s) * 14)}deg`, clipPath: torn(4.2 * 60 * u, 1.25 * 60 * u, s + j * 3, 2 * u, 5 * u), fontSize: (c.size ?? 60) * u + "px" });
    });
    el.style.left = c.x * R.W - el.offsetWidth / 2 + "px";
    el.style.top = c.y * R.H - el.offsetHeight / 2 + "px";
  }
}

function renderAt(t) {
  if (R._needsLayout) { layout(); R._needsLayout = false; }
  const P = R.P, u = R.u;
  // Stop-motion: positions jitter on a coarse clock (like animated paper on a table).
  const step = Math.floor(t * (P.boil.fps || 10));
  for (const k of pieces) {
    const c = k.c, tin = c.in ?? R.start, tout = c.out ?? R.end;
    const vis = t >= tin && t <= tout;
    k.el.style.display = vis ? "" : "none";
    if (!vis) continue;
    const sl = c.slap ?? P.slap, p = tw(t, tin, sl, ease.outBack), q = tw(t, tout - 0.25, 0.25, ease.inCubic);
    const a = P.boil.amount * (c.boil ?? 1), jx = (rand(step, k.seed, 1) - 0.5) * 3 * a * u, jy = (rand(step, k.seed, 2) - 0.5) * 3 * a * u;
    const jr = (rand(step, k.seed, 3) - 0.5) * 0.8 * a;
    const rot = (c.rot ?? (rand(k.seed) * 8 - 4)) + jr + (1 - p) * 12;
    const sc = (1.25 - 0.25 * p) * (1 - q * 0.15);
    k.el.style.transform = `translate(${jx}px, ${jy - q * 40 * u}px) rotate(${rot}deg) scale(${sc})`;
    k.el.style.opacity = clamp(p * 4) * (1 - q);
  }
}

R.define({ ready: build, renderAt, onParams: () => build() });
</script>
</body>
</html>
