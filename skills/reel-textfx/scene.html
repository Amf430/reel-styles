<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="/r/engine/web/base.css">
<style>
  .fx { position: absolute; left: 0; top: 0; white-space: nowrap; line-height: 1.2; }
  .fx > .in { position: relative; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; }
  .tx { position: relative; display: inline-block; }
  .w { display: inline-block; }
  .abs { position: absolute; inset: 0; }
  .ghost { visibility: hidden; }
  .bar, .hlbox { position: absolute; z-index: 0; }
  .fx .tx > .lay { position: absolute; inset: 0; }
  .bub::after { content: ""; position: absolute; left: 50%; bottom: -0.2em; transform: translateX(-50%); border: 0.22em solid transparent;
                border-top-color: var(--bub); border-bottom: 0; }
  svg.ov { position: absolute; overflow: visible; pointer-events: none; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module">
import { Reel, tw, ease, clamp, lerp, rand, noise1, richWords } from "/r/engine/web/base.js";

const R = await Reel.init();
const stage = document.getElementById("stage");
const E = { ...ease,
  outBounce: (k) => { const n = 7.5625, d = 2.75;
    if (k < 1 / d) return n * k * k; if (k < 2 / d) return n * (k -= 1.5 / d) * k + 0.75;
    if (k < 2.5 / d) return n * (k -= 2.25 / d) * k + 0.9375; return n * (k -= 2.625 / d) * k + 0.984375; } };

// ------------------------------------------------------------------ helpers
const h = (tag, cls, parent, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; parent?.appendChild(e); return e; };
const plain = (s) => String(s ?? "").replace(/\*/g, "");
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const rgba = (hex, a) => { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; };

// Kashida (ـ): stretched before the last letter that can join forward (انتبـــه, الحكايـــة, لكـــن).
const NONJOIN = new Set("اأإآٱدذرزوؤةىءـ");
const isAr = (c) => /[ؠ-ي]/.test(c), isMark = (c) => /[ً-ٰٟ]/.test(c);
function kashidaAt(word) {
  const ch = [...word]; let at = -1;
  for (let i = 0; i < ch.length; i++) {
    if (!isAr(ch[i]) || NONJOIN.has(ch[i])) continue;
    let j = i + 1; while (j < ch.length && isMark(ch[j])) j++;
    if (j < ch.length && isAr(ch[j])) at = j;
  }
  return at;
}
const stretch = (word, n) => { const at = kashidaAt(word); if (at < 0 || n < 1) return word; const ch = [...word]; return ch.slice(0, at).join("") + "ـ".repeat(n) + ch.slice(at).join(""); };
// the word to stretch: the *marked* one, else the longest that can take a kashida
function kashidaWord(words) {
  const hl = words.findIndex((w) => w.hl && kashidaAt(w.text) >= 0);
  if (hl >= 0) return hl;
  let best = -1, len = 0;
  words.forEach((w, i) => { if (kashidaAt(w.text) >= 0 && w.text.length > len) { best = i; len = w.text.length; } });
  return best;
}

function textEl(text, parent, cls = "tx") {
  const d = h("div", cls, parent);
  const rw = richWords(text);
  d.innerHTML = rw.html;
  return { el: d, words: [...d.querySelectorAll(".w")], data: rw.words };
}
const ws = (c) => c.T.weight ?? 800;

// ------------------------------------------------------------------ effects
// Each: dur (entrance, s), accent (default colour), build(c) → DOM, render(c, s) where s = { t, lt (s since in),
// k (entrance 0..1), o (exit 0..1) }, sfx(c) → [{ at (s after in), id, v?, gain? }], exit: true = the effect
// handles its own exit (otherwise a fade/blur/shrink is applied to the whole item).
const FX = {};

FX.select = { dur: 0.9, accent: "#ff6b9a",
  build(c) { c.tx = textEl(c.text, c.box); c.bar = h("div", "bar", c.tx.el); Object.assign(c.bar.style, { inset: "-0.06em -0.18em", background: c.A, zIndex: 0 });
             c.tx.el.style.position = "relative"; c.tx.el.style.zIndex = 1; },
  render(c, s) {
    const g = tw(s.lt, 0, 0.35, E.outCubic), txt = tw(s.lt, 0.12, 0.35, E.outCubic), off = tw(s.lt, 0.6, 0.35, E.inOutCubic);
    c.bar.style.clipPath = `inset(0 ${off * 100}% 0 ${(1 - g) * 100}%)`;
    c.tx.el.style.clipPath = `inset(-20% -5% -20% ${(1 - txt) * 105 - 5}%)`;
  },
  sfx: () => [{ at: 0, id: "swipe_ui" }, { at: 0.6, id: "click_soft", gain: -4 }] };

FX.type = { accent: "#2de0c0",
  dur: (c) => [...plain(c.text)].length * (c.it.per ?? 0.055),
  build(c) {
    c.chars = [...plain(c.text)];
    const t = h("div", "tx", c.box); h("span", "ghost", t, esc(plain(c.text)));
    c.typed = h("span", "lay", t); c.typed.style.textAlign = "right";
    c.txt = h("span", null, c.typed); c.caret = h("span", null, c.typed);
    Object.assign(c.caret.style, { display: "inline-block", width: "0.06em", height: "1em", background: c.A, verticalAlign: "-0.12em", marginInlineStart: "0.06em" });
  },
  render(c, s) {
    const n = Math.floor(clamp(s.lt / c.dur) * c.chars.length + 1e-6);
    c.txt.textContent = c.chars.slice(0, n).join("");
    c.caret.style.opacity = s.lt < c.dur || Math.floor(s.lt * 2.2) % 2 === 0 ? 1 : 0;
  },
  sfx: (c) => [{ at: 0, id: "typing", len: c.dur + 0.1 }] };

const wordsIn = (fn) => ({
  build(c) { c.tx = textEl(c.text, c.box); },
  render(c, s) { c.tx.words.forEach((w, i) => fn(c, s, w, i, c.tx.words.length)); },
});
FX.pop = { dur: 0.45, accent: "#ffd400", ...wordsIn((c, s, w, i) => {
    const k = tw(s.lt, i * (c.it.stagger ?? 0.12), c.dur, E.linear), e = E.outBack(k);
    const dx = (rand(i, 1, c.seed) * 2 - 1) * 1.6, dy = (rand(i, 2, c.seed) * 2 - 1) * 1.3;
    w.style.opacity = clamp(k * 4);
    w.style.transform = `translate(${dx * (1 - e)}em, ${dy * (1 - e)}em) scale(${0.3 + 0.7 * e})`;
  }),
  sfx: (c) => c.words.map((_, i) => ({ at: i * (c.it.stagger ?? 0.12), id: "pop", v: i, gain: -3 })) };

FX.rise = { dur: 0.55, accent: "#ffffff", ...wordsIn((c, s, w, i) => {
    const e = tw(s.lt, i * (c.it.stagger ?? 0.1), c.dur, E.outQuint);
    w.style.opacity = e; w.style.transform = `translateY(${(1 - e) * 0.6}em)`;
    w.style.filter = e < 0.98 ? `blur(${(1 - e) * 0.25}em)` : "none";
  }),
  sfx: () => [{ at: 0, id: "whoosh_soft", gain: -4 }] };

FX.drop = { dur: 0.7, accent: "#ffffff", ...wordsIn((c, s, w, i) => {
    const k = tw(s.lt, i * (c.it.stagger ?? 0.1), c.dur, E.linear);
    w.style.opacity = clamp(k * 5); w.style.transform = `translateY(${-(1 - E.outBounce(k)) * 2.2}em)`;
  }),
  sfx: (c) => c.words.map((_, i) => ({ at: i * (c.it.stagger ?? 0.1) + 0.26, id: "tap", v: i, gain: -2 })) };

function kashidaFx(c) {
  c.kw = kashidaWord(c.tx.data);
  c.kn = -1;
}
function setKashida(c, n) {
  if (c.kw < 0 || n === c.kn) return;
  c.kn = n;
  const els = [c.tx, ...(c.copies || [])];
  for (const t of els) t.words[c.kw].textContent = stretch(c.tx.data[c.kw].text, n);
}
FX.kashida = { dur: 0.9, accent: "#ffd400",
  build(c) { c.tx = textEl(c.text, c.box); kashidaFx(c); c.tx.words.forEach((w) => w.classList.contains("hl") && (w.style.color = c.A)); },
  render(c, s) {
    const a = tw(s.lt, 0, 0.3, E.outCubic);
    c.tx.el.style.opacity = a; c.tx.el.style.filter = a < 0.98 ? `blur(${(1 - a) * 0.2}em)` : "none";
    setKashida(c, Math.round((c.it.kashida ?? 6) * tw(s.lt, 0.15, 0.6, E.outCubic)));
  },
  sfx: () => [{ at: 0.12, id: "whoosh_soft", gain: -3 }] };

FX.underline = { dur: 0.75, accent: "#2de0c0",
  build(c) { const t = h("div", "tx", c.box); c.t = t; c.tx = textEl(c.text, t);
             c.line = h("div", "bar", t); Object.assign(c.line.style, { left: "-0.04em", right: "-0.04em", bottom: "-0.02em", height: "0.075em", borderRadius: "1em", background: c.A, transformOrigin: "100% 50%" }); },
  render(c, s) {
    c.line.style.transform = `scaleX(${tw(s.lt, 0, 0.4, E.outExpo)})`;
    const e = tw(s.lt, 0.22, 0.5, E.outQuint);
    c.tx.el.style.clipPath = "inset(-0.6em -0.6em 0.02em -0.6em)";
    c.tx.el.style.transform = `translateY(${(1 - e) * 1.05}em)`;
  },
  sfx: () => [{ at: 0, id: "draw_line", v: 1, gain: -3 }] };

FX.box = { dur: 0.6, accent: "#ffe14d",
  build(c) { const t = h("div", "tx", c.box); c.t = t;
             c.bg = h("div", "hlbox", t); Object.assign(c.bg.style, { inset: "0.02em -0.25em -0.04em", background: c.A, transformOrigin: "100% 50%", borderRadius: "0.06em" });
             c.tx = textEl(c.text, t); c.tx.el.style.color = c.it.text_color || "#111"; c.tx.el.style.textShadow = "none"; },
  render(c, s) {
    c.bg.style.transform = `scaleX(${tw(s.lt, 0, 0.35, E.outExpo)})`;
    c.tx.el.style.clipPath = `inset(-20% 0 -20% ${(1 - tw(s.lt, 0.15, 0.35, E.outCubic)) * 100}%)`;
  },
  sfx: () => [{ at: 0, id: "swipe_ui" }] };

FX.brackets = { dur: 0.6, accent: "#2de0c0",
  build(c) { const t = h("div", "tx", c.box); c.t = t; c.tx = textEl(c.text, t);
             c.cn = [0, 1, 2, 3].map((i) => { const d = h("div", "bar", t); const b = `0.07em solid ${c.A}`;
               Object.assign(d.style, { width: "0.32em", height: "0.32em", [i < 2 ? "borderTop" : "borderBottom"]: b, [i % 2 ? "borderLeft" : "borderRight"]: b }); return d; }); },
  render(c, s) {
    const e = tw(s.lt, 0, 0.45, E.outBack), pad = 0.22 + 0.03 * Math.sin(s.t * 3);
    const W = c.t.offsetWidth, H = c.t.offsetHeight, fs = parseFloat(getComputedStyle(c.t).fontSize);
    c.cn.forEach((d, i) => {
      const sx = i % 2 ? -1 : 1, sy = i < 2 ? -1 : 1;
      const x = W / 2 + sx * (W / 2 + pad * fs) * e - (sx > 0 ? 0.32 * fs : 0), y = H / 2 + sy * (H / 2 + pad * fs * 0.6) * e - (sy > 0 ? 0.32 * fs : 0);
      Object.assign(d.style, { left: x + "px", top: y + "px", opacity: clamp(e * 3) });
    });
    c.tx.el.style.opacity = tw(s.lt, 0.15, 0.35);
  },
  sfx: () => [{ at: 0.05, id: "click" }] };

FX.glitch = { dur: 0.45, accent: "#00f0ff",
  build(c) { const t = h("div", "tx", c.box); c.t = t;
             c.cy = textEl(c.text, t, "lay"); c.rd = textEl(c.text, t, "lay"); c.tx = textEl(c.text, t);
             c.cy.el.style.color = c.A; c.rd.el.style.color = c.it.accent2 || "#ff2a55"; [c.cy, c.rd].forEach((l) => (l.el.style.textShadow = "none"));
             c.band = textEl(c.text, t, "lay"); },
  render(c, s) {
    const every = c.it.every ?? 1.8, ph = s.lt < c.dur ? 0 : (s.lt - c.dur) % every;
    const g = s.lt < c.dur || ph < 0.14, f = Math.floor(s.t * 30);
    const j = (k) => (rand(f, k, c.seed) - 0.5) * (g ? 0.16 : 0);
    c.cy.el.style.transform = `translate(${j(1) - (g ? 0.03 : 0.012)}em, ${j(2) * 0.3}em)`;
    c.rd.el.style.transform = `translate(${j(3) + (g ? 0.03 : 0.012)}em, ${j(4) * 0.3}em)`;
    c.tx.el.style.transform = `translateX(${j(5) * 0.5}em)`;
    const top = rand(f, 6, c.seed) * 80;
    c.band.el.style.clipPath = g ? `inset(${top}% -10% ${100 - top - 12}% -10%)` : "inset(50% 0 50% 0)";
    c.band.el.style.transform = `translateX(${j(7) * 2}em)`;
    c.t.style.opacity = s.lt < c.dur ? (rand(f, 8, c.seed) > 0.25 ? 1 : 0.2) : 1;
  },
  sfx: (c) => { const ev = [{ at: 0, id: "glitch" }]; const every = c.it.every ?? 1.8;
    for (let a = c.dur; a < c.life - 0.4; a += every) ev.push({ at: a, id: "glitch", v: 1, gain: -6 }); return ev; } };

FX.news = { dur: 0.6, accent: "#e0242b",
  build(c) { const row = h("div", null, c.box); Object.assign(row.style, { display: "flex", alignItems: "stretch", fontSize: "0.62em" });
             c.tag = h("div", null, row, esc(c.it.sub || "عاجل")); Object.assign(c.tag.style, { background: c.A, padding: "0.12em 0.4em 0.16em", fontWeight: 800, borderRadius: "0.12em 0 0 0.12em" });
             c.bar = h("div", null, row); Object.assign(c.bar.style, { background: "rgba(12,12,16,.88)", padding: "0.12em 0.6em 0.16em", overflow: "hidden" });
             c.tx = textEl(c.text, c.bar); c.tx.el.style.fontWeight = 600; c.tx.el.style.textShadow = "none"; c.row = row; },
  render(c, s) {
    const e = tw(s.lt, 0, 0.3, E.outBack); c.tag.style.transform = `scale(${e})`; c.tag.style.opacity = clamp(e * 3);
    c.bar.style.clipPath = `inset(0 0 0 ${(1 - tw(s.lt, 0.12, 0.45, E.outExpo)) * 100}%)`;
    const m = tw(s.lt, 0.22, 0.45, E.outQuint); c.tx.el.style.transform = `translateX(${(1 - m) * 1.5}em)`; c.tx.el.style.opacity = m;
  },
  sfx: () => [{ at: 0, id: "alert", gain: -8 }, { at: 0.12, id: "swipe_ui" }] };

FX.bubble = { dur: 0.4, accent: "#ffffff",
  build(c) { c.b = h("div", "tx bub", c.box); Object.assign(c.b.style, { background: c.A, color: c.it.text_color || "#111", borderRadius: "0.32em", padding: "0.1em 0.45em 0.16em", transformOrigin: "50% 130%", "--bub": c.A });
             c.b.style.setProperty("--bub", c.A); c.tx = textEl(c.text, c.b); c.tx.el.style.textShadow = "none"; c.b.style.boxShadow = "0 .08em .3em rgba(0,0,0,.35)"; },
  render(c, s) { const e = E.outBack(tw(s.lt, 0, c.dur, E.linear)); c.b.style.transform = `scale(${Math.max(0, e)})`; c.tx.el.style.opacity = tw(s.lt, 0.12, 0.2); },
  sfx: () => [{ at: 0, id: "message_in" }] };

FX.glowchar = { accent: "#2de0c0",
  dur: (c) => Math.min(1.4, [...plain(c.text)].length * 0.07) + 0.3,
  build(c) { const t = h("div", "tx", c.box); c.ch = [...plain(c.text)].map((ch) => h("span", null, t, esc(ch))); c.t = t; },
  render(c, s) { const per = (c.dur - 0.3) / c.ch.length;
    c.ch.forEach((sp, i) => { const k = tw(s.lt, i * per, 0.3, E.linear), pk = Math.sin(Math.PI * k);
      sp.style.color = `rgba(255,255,255,${0.22 + 0.78 * k})`; sp.style.textShadow = k > 0 ? `0 0 ${0.08 + 0.25 * pk}em ${rgba(c.A, 0.3 + 0.7 * pk)}` : "none"; }); },
  sfx: () => [{ at: 0, id: "sparkle", gain: -4 }] };

FX.swipe = { dur: 0.45, accent: "#2de0c0",
  build(c) { const t = h("div", "tx", c.box); c.t = t; c.tx = textEl(c.text, t);
             c.st = h("div", "bar", t); Object.assign(c.st.style, { bottom: "-0.04em", height: "0.06em", width: "70%", borderRadius: "1em", background: `linear-gradient(90deg, transparent, ${c.A})` }); },
  render(c, s) { const e = tw(s.lt, 0, c.dur, E.outExpo);
    Object.assign(c.tx.el.style, { opacity: clamp(e * 3), transform: `translateX(${(1 - e) * 1.8}em) skewX(${-14 * (1 - e)}deg) scaleX(${1 + 0.35 * (1 - e)})`, filter: e < 0.97 ? `blur(${(1 - e) * 0.12}em)` : "none" });
    const p = tw(s.lt, 0.05, 0.55, E.outCubic); c.st.style.left = lerp(100, -75, p) + "%"; c.st.style.opacity = Math.sin(Math.PI * p); },
  sfx: () => [{ at: 0, id: "whoosh_fast" }] };

// ---- «ستايل ترند» (text ones)
FX.reveal = { dur: 0.95, accent: "#ff8a1f",
  build(c) { const t = h("div", "tx", c.box); c.t = t; c.tx = textEl(c.text, t);
             c.tr = h("div", "bar", t); Object.assign(c.tr.style, { top: "52%", height: "0.05em", borderRadius: "1em" });
             c.sp = h("div", "bar", t); Object.assign(c.sp.style, { width: "0.34em", height: "0.34em", top: "calc(52% - 0.15em)", borderRadius: "50%",
               background: `radial-gradient(circle, #fff 0 22%, ${c.A} 45%, transparent 70%)`, boxShadow: `0 0 .4em ${c.A}` }); },
  render(c, s) { const p = tw(s.lt, 0, c.dur, E.inOutCubic), W = c.t.offsetWidth;
    c.tx.el.style.clipPath = `inset(-30% 0 -30% ${(1 - p) * 100}%)`;
    const x = W * (1 - p); c.sp.style.left = x - W * 0.012 + "px"; c.sp.style.opacity = p < 1 ? 1 : clamp(1 - (s.lt - c.dur) * 4);
    c.tr.style.left = x + "px"; c.tr.style.width = Math.min(W - x, W * 0.35) + "px";
    c.tr.style.background = `linear-gradient(90deg, ${c.A}, transparent)`; c.tr.style.opacity = c.sp.style.opacity * 0.9; },
  sfx: () => [{ at: 0, id: "shine" }] };

FX.twotone = { dur: 0.9, accent: "#ffb02e",
  build(c) { const [a, b] = plain(c.text).split(/\s*[|\n]\s*/); c.l1 = textEl(a || "", c.box); c.l1.el.style.color = c.A; c.l1.el.style.fontSize = "0.8em";
             c.tx = textEl(b || "", c.box); kashidaFx(c); },
  render(c, s) { const e1 = tw(s.lt, 0, 0.45, E.outQuint), e2 = tw(s.lt, 0.12, 0.45, E.outQuint);
    c.l1.el.style.opacity = e1; c.l1.el.style.transform = `translateY(${(1 - e1) * 0.5}em)`;
    c.tx.el.style.opacity = e2; c.tx.el.style.transform = `translateY(${(1 - e2) * 0.5}em)`;
    setKashida(c, Math.round((c.it.kashida ?? 10) * tw(s.lt, 0.3, 0.6, E.outCubic))); },
  sfx: () => [{ at: 0, id: "whoosh_soft", gain: -3 }] };

FX.stack = { dur: 1.0, accent: "#ff8a1f",
  build(c) { c.box.style.lineHeight = 1.0; c.lines = plain(c.text).split(/\s+/).filter(Boolean).map((w) => {
               const l = textEl(stretch(w, c.it.kashida ?? 4), c.box); return l; });
             const first = c.lines[0]?.el; if (first) { c.svg = h("div", null, first); c.svg.innerHTML = `<svg class="ov"><ellipse fill="none"/></svg>`; c.el = c.svg.querySelector("ellipse"); c.sv = c.svg.querySelector("svg"); } },
  layout(c) { if (!c.el) return; const t = c.lines[0].el, W = t.offsetWidth, H = t.offsetHeight, fs = parseFloat(getComputedStyle(t).fontSize);
    Object.assign(c.sv.style, { left: 0, top: 0, width: W + "px", height: H + "px" });
    c.el.setAttribute("cx", W / 2); c.el.setAttribute("cy", H / 2); c.el.setAttribute("rx", W / 2 + 0.25 * fs); c.el.setAttribute("ry", H / 2 + 0.08 * fs);
    c.el.setAttribute("stroke", c.A); c.el.setAttribute("stroke-width", 0.04 * fs); c.len = c.el.getTotalLength(); c.el.style.strokeDasharray = c.len; },
  render(c, s) { c.lines.forEach((l, i) => { const e = tw(s.lt, i * 0.12, 0.45, E.outQuint); l.el.style.opacity = e; l.el.style.transform = `translateY(${(1 - e) * 0.4}em)`; });
    if (c.el) c.el.style.strokeDashoffset = c.len * (1 - tw(s.lt, 0.45, 0.5, E.inOutCubic)); },
  sfx: () => [{ at: 0, id: "whoosh_soft", gain: -4 }, { at: 0.45, id: "draw_circle", gain: -2 }] };

FX.name = { dur: 0.9, accent: "#ffb02e",
  build(c) { c.box.style.lineHeight = 1.05;
             c.tx = textEl(c.text, c.box); c.tx.el.style.color = c.A;
             const lat = h("div", "tx", c.box); Object.assign(lat.style, { fontSize: "0.52em", letterSpacing: "0.12em", color: c.A, fontWeight: 900, direction: "ltr" });
             c.lat = [...String(c.it.sub || "").toUpperCase()].map((ch) => h("span", null, lat, ch === " " ? "&nbsp;" : esc(ch)));
             const dots = h("div", null, c.box); Object.assign(dots.style, { display: "flex", gap: "0.12em", marginTop: "0.08em" });
             c.dots = [0, 1, 2].map(() => { const d = h("div", null, dots); Object.assign(d.style, { width: "0.07em", height: "0.07em", borderRadius: "50%", background: c.A }); return d; });
             c.sl = h("div", "bar", c.box); Object.assign(c.sl.style, { left: "50%", top: "50%", width: "2.6em", height: "0.03em", background: `linear-gradient(90deg, transparent, ${c.A}, transparent)`, transformOrigin: "50% 50%" }); },
  render(c, s) {
    c.tx.el.style.clipPath = `inset(-30% 0 -30% ${(1 - tw(s.lt, 0.1, 0.5, E.outCubic)) * 100}%)`;
    c.lat.forEach((sp, i) => { sp.style.opacity = s.lt > 0.25 + rand(i, 3, c.seed) * 0.5 ? 1 : 0; });
    c.dots.forEach((d, i) => (d.style.opacity = tw(s.lt, 0.7 + i * 0.08, 0.15)));
    const p = tw(s.lt, 0, 0.55, E.inOutCubic);
    c.sl.style.transform = `translate(-50%, -50%) translate(${lerp(1.4, -1.4, p)}em, ${lerp(-0.7, 0.7, p)}em) rotate(-25deg)`; c.sl.style.opacity = Math.sin(Math.PI * p); },
  sfx: () => [{ at: 0, id: "whip", v: 1, gain: -3 }, { at: 0.25, id: "shine", gain: -4 }] };

FX.spot = { dur: 1.0, accent: "#ffd400",
  build(c) { const t = h("div", "tx", c.box); c.t = t; c.dim = textEl(c.text, t); c.dim.el.style.opacity = 0.18;
             c.lit = textEl(c.text, t, "lay"); c.lit.words.forEach((w) => w.classList.contains("hl") && (w.style.color = c.A));
             c.sp = h("div", "bar", t); Object.assign(c.sp.style, { width: "1.6em", height: "1.6em", borderRadius: "50%", top: "calc(50% - 0.8em)", background: "radial-gradient(circle, rgba(255,255,255,.28), transparent 65%)" }); },
  render(c, s) { const p = tw(s.lt, 0, 0.8, E.inOutCubic), W = c.t.offsetWidth, fs = parseFloat(getComputedStyle(c.t).fontSize);
    const x = lerp(W + 0.4 * fs, -0.4 * fs, p), full = tw(s.lt, 0.7, 0.35, E.outCubic), r = lerp(0.75 * fs, W * 1.3, full);
    c.lit.el.style.webkitMaskImage = `radial-gradient(circle at ${x}px 50%, #000 ${r * 0.8}px, transparent ${r}px)`;
    c.sp.style.left = x - 0.8 * fs + "px"; c.sp.style.opacity = 1 - full;
    c.dim.el.style.opacity = 0.18 * (1 - full); c.t.style.opacity = tw(s.lt, 0, 0.15); },
  sfx: () => [{ at: 0, id: "whoosh_deep", gain: -8 }, { at: 0.75, id: "ding", gain: -8 }] };

FX.frame = { dur: 1.0, accent: "#ff8a1f",
  build(c) { c.box.style.fontSize = "1em"; c.fr = h("div", null, c.box); c.fr.style.position = "relative";
             c.svg = h("div", null, c.fr); c.svg.innerHTML = `<svg class="ov"><rect fill="none"/></svg>`; c.rect = c.svg.querySelector("rect"); c.sv = c.svg.querySelector("svg");
             c.cap = h("div", null, c.fr); Object.assign(c.cap.style, { position: "absolute", left: 0, right: 0, bottom: "0.5em", display: "flex", flexDirection: "column", alignItems: "center", fontSize: "0.5em", lineHeight: 1.15 });
             c.l1 = textEl(c.text, c.cap); c.l2 = c.it.sub ? textEl(c.it.sub, c.cap) : null; },
  layout(c) { const W = (c.it.w ?? 0.62) * R.W, H = (c.it.h ?? 0.42) * R.H, sw = 5 * R.u;
    Object.assign(c.fr.style, { width: W + "px", height: H + "px" }); Object.assign(c.sv.style, { left: 0, top: 0, width: W + "px", height: H + "px" });
    Object.assign(c.rect, {}); c.rect.setAttribute("x", sw / 2); c.rect.setAttribute("y", sw / 2); c.rect.setAttribute("width", W - sw); c.rect.setAttribute("height", H - sw);
    c.rect.setAttribute("rx", 0.06 * Math.min(W, H)); c.rect.setAttribute("stroke", c.A); c.rect.setAttribute("stroke-width", sw);
    c.sv.style.filter = `drop-shadow(0 0 ${8 * R.u}px ${c.A})`; c.len = c.rect.getTotalLength(); c.rect.style.strokeDasharray = c.len; },
  render(c, s) { c.rect.style.strokeDashoffset = c.len * (1 - tw(s.lt, 0, 0.8, E.inOutCubic));
    [c.l1, c.l2].filter(Boolean).forEach((l, i) => { const e = tw(s.lt, 0.5 + i * 0.1, 0.4, E.outQuint); l.el.style.opacity = e; l.el.style.transform = `translateY(${(1 - e) * 0.5}em)`; }); },
  sfx: () => [{ at: 0, id: "draw_line", v: 2, gain: -6 }, { at: 0.5, id: "pop_low", gain: -4 }] };

// ------------------------------------------------------------------ build / layout / render
let items = [];

function build() {
  document.body.dir = R.P.dir || "rtl";
  stage.innerHTML = "";
  R.clearItems();
  items = (R.P.items || []).map((it, idx) => {
    const fx = FX[it.fx] || FX.rise;
    const T = R.T, A = it.accent || (T.accent && T.accent !== "auto" ? T.accent : fx.accent);
    const root = h("div", "fx", stage), box = h("div", "in", root);
    const c = { it, fx, T, A, root, box, text: it.text ?? "", seed: idx + 1 };
    c.words = richWords(c.text).words;
    root.style.fontWeight = it.weight ?? ws(c);
    if (it.font || R.P.font) root.style.fontFamily = `"${it.font || R.P.font}", Tajawal`;
    root.style.color = it.color || T.text || "#fff";
    root.style.textShadow = T.shadow > 0 ? `0 0.04em 0.18em rgba(0,0,0,${T.shadow})` : "none";
    fx.build(c);
    c.dur = (typeof fx.dur === "function" ? fx.dur(c) : fx.dur) * (it.speed ? 1 / it.speed : 1);
    c.life = (it.out ?? R.end) - (it.in ?? R.start);
    R.item({ id: "fx" + idx, label: `${it.fx}: ${plain(c.text).slice(0, 24)}`, els: [root], in: `items.${idx}.in`, out: `items.${idx}.out`, xf: `items.${idx}.xf` });
    return c;
  });
  style();
}

function style() {
  for (const c of items) {
    c.root.style.fontSize = (c.it.size ?? 110) * R.u + "px";
    c.root.style.left = (c.it.x ?? 0.5) * R.W + "px";
    c.root.style.top = (c.it.y ?? 0.5) * R.H + "px";
    c.fx.layout?.(c);
  }
}

function renderAt(t) {
  if (R._needsLayout) { style(); R._needsLayout = false; }
  const outDur = R.P.out_dur ?? 0.35;
  for (const c of items) {
    const tin = c.it.in ?? R.start, tout = c.it.out ?? R.end;
    const vis = t >= tin && t <= tout;
    c.root.style.display = vis ? "" : "none";
    if (!vis) continue;
    const lt = t - tin, o = c.it.out_anim === "cut" ? 0 : tw(t, tout - outDur, outDur, E.inCubic);
    c.fx.render(c, { t, lt, o, k: clamp(lt / c.dur) });
    if (!c.fx.exit) Object.assign(c.box.style, { opacity: 1 - o, filter: o > 0.01 ? `blur(${o * 0.12}em)` : "", transform: `translate(-50%, -50%) scale(${1 - 0.06 * o})` });
  }
}

function meta() {
  const sfx = [];
  for (const c of items) {
    if (c.it.sfx === false) continue;
    const tin = c.it.in ?? R.start;
    let ev = c.fx.sfx ? c.fx.sfx(c) : [];
    if (typeof c.it.sfx === "string") ev = ev.slice(0, 1).map((e) => ({ ...e, id: c.it.sfx, v: 0 }));
    for (const e of ev) sfx.push({ ...e, t: +(tin + e.at).toFixed(3), gain: (e.gain ?? 0) + (c.it.sfx_gain ?? 0) });
  }
  return { sfx, effects: Object.keys(FX) };
}

R.define({ ready: build, renderAt, meta, onParams: () => build() });
</script>
</body>
