<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="content.js"></script>
<script src="logo/parts.js"></script>
<script src="lib/logobuild.js"></script>
<link rel="stylesheet" href="lib/charity.css">
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-width="1920" data-height="1080" data-duration="4.5">
  <section id="intro" class="clip scene" data-start="0" data-duration="4.5">
    <div class="cam" id="stage">
      <div class="pulse" id="p1"></div><div class="pulse b" id="p2"></div><div class="pulse" id="p3"></div>
      <div id="logo"></div>
    </div>
    <svg class="fx" viewBox="0 0 1920 1080">
      <circle id="r1" fill="none"/><circle id="r2" fill="none"/><circle id="r3" fill="none"/>
    </svg>
  </section>
</div>
<script>
const P = CONTENT.palette;
Object.entries({ "--accent": P.accent, "--light": P.light }).forEach(([k, v]) => document.documentElement.style.setProperty(k, v));
[["r1", P.primary], ["r2", P.accent], ["r3", P.light]].forEach(([id, c]) => document.getElementById(id).setAttribute("stroke", c));

// the logo fits a 1600×600 box in the middle of the frame
const k = Math.min(1600 / LOGO.w, 600 / LOGO.h);
const rect = { width: LOGO.w * k, height: LOGO.h * k };
rect.left = 960 - rect.width / 2; rect.top = 540 - rect.height / 2;
const box = document.getElementById("logo");
Object.assign(box.style, { left: `${rect.left}px`, top: `${rect.top}px`, width: `${rect.width}px`, height: `${rect.height}px` });
mountLogo(box, LOGO, [P.primary, P.accent, P.lightAccent]);
const f = focusPoint(rect, LOGO);
["p1", "p2", "p3"].forEach((id) => Object.assign(document.getElementById(id).style, { left: `${f.x}px`, top: `${f.y}px` }));

const tl = gsap.timeline({ paused: true });
ringsTo(tl, ["#r3", "#r2", "#r1"], { x: 960, y: 540, r: 1250, w: 900 }, { x: f.x, y: f.y, r: 40, w: 6 }, 0, 0.6);
buildLogo(tl, box, LOGO, 0.45);
pulseRings(tl, ["#p1", "#p2", "#p3"], 1.0);
// slow push-in through the hold, then a short push-through exit into the white of the next scene
tl.fromTo("#stage", { scale: 0.97 }, { scale: 1.02, duration: 3.75, ease: "none" }, 0.4);
tl.to("#stage", { scale: 1.12, opacity: 0, filter: "blur(6px)", duration: 0.34, ease: "power2.in" }, 4.15);
window.__timelines = window.__timelines || {};
window.__timelines["main"] = tl;
</script>
</body>
</html>
